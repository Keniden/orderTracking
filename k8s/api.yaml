apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-tracking-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-api}
  template:
    metadata: { labels: {app: order-api} }
    spec:
      containers:
        - name: api
          image: order-tracking/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
          volumeMounts:
            - name: cfg
              mountPath: /app/internal/configs/config.yml
              subPath: config.yml
      volumes:
        - name: cfg
          configMap:
            name: order-tracking-config
---
apiVersion: v1
kind: Service
metadata:
  name: order-tracking-api
spec:
  selector: {app: order-api}
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-tracking-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-tracking-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

