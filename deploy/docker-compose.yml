version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: qwerty
    ports: ["5436:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    ports: ["9000:9000", "8123:8123"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports: ["7687:7687", "7474:7474"]

  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.4
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      - PORT=8000
    depends_on: [postgres, redis, kafka]
    ports: ["8000:8000"]

  outbox-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    depends_on: [postgres, kafka]

  order-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.consumer
    depends_on: [kafka, redis, clickhouse, neo4j]

  grpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.grpc
    depends_on: [postgres, kafka]
    ports:
      - "9090:9090"   # gRPC
      - "8080:8080"   # grpc-gateway HTTP

volumes:
  pgdata: {}
